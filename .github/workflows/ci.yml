name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  # 项目组长合并三路 M2 代码后，可手动对合并态 develop 触发真实服务 E2E 实跑验证。
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本一致性检查需要能读取 tag 与 origin/develop，取全量历史与引用。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 不写死 version：让 action-setup 读取根 package.json 的
      # "packageManager": "pnpm@9.15.9"，避免 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4

      # ------------------------------------------------------------------
      # M2：三包已合并到 develop，pnpm-lock.yaml 覆盖全部 importer，
      # 故切回 --frozen-lockfile：干净 checkout 下 lockfile 与三份 package.json
      # 不一致时立即失败，不再静默更新依赖（M1 的并行建包期已结束）。
      # ------------------------------------------------------------------
      - name: Install (frozen lockfile, M2 three-package workspace)
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # 真实门禁前置步骤（install 之后、Lint 之前，顺序固定，M1 踩坑要点保留）：
      # 干净 checkout 里 packages/shared/dist 不存在（.gitignore 忽略 dist/），
      # 而 @campus-go/server 的 typecheck/test/build 都 import @campus-go/shared，
      # 其 main/types 指向 dist/index.js；不先产出 dist 会报 TS2307 / Cannot find module。
      # @prisma/client 未 generate 时 Jest 报 did not initialize yet。
      # 两者缺其一，合并后第一跑就是红的。
      # ------------------------------------------------------------------
      - name: Build shared package (prerequisite for server imports)
        run: pnpm --filter @campus-go/shared run build
      - name: Generate Prisma Client (prerequisite for server tests)
        run: pnpm --filter @campus-go/server exec prisma generate

      # `pnpm -r run --if-present <script>`：--if-present 必须放在 run 之后、
      # 脚本名之前。写反（放在末尾）会把 flag 透传给脚本本身，在「零子包空跑」时
      # 伪装成绿、三包齐全后必红。此写法在缺脚本的包上跳过，零子包时返回 0。
      - name: Report workspace shape
        run: |
          echo "Workspace packages detected:"
          pnpm -r list --depth -1 2>/dev/null || echo "(root only — quality scripts will be skipped by --if-present)"

      - name: Lint
        run: pnpm -r run --if-present lint
      - name: Typecheck
        run: pnpm -r run --if-present typecheck
      - name: Test
        run: pnpm -r run --if-present test
      - name: Build
        run: pnpm -r run --if-present build

      # ------------------------------------------------------------------
      # 契约结构回归（M1 拦截层，保留）：不依赖真实服务，用符合契约的 fixture
      # 断言统一响应体 / 分页 / 401·403 红线判定，任何分支都可独立全绿。
      # 真实服务联通由 e2e-real job 负责，二者互不替代、互不假装。
      # ------------------------------------------------------------------
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E contract regression (fixtures via route interception)
        run: pnpm run test:e2e:contract

      # ------------------------------------------------------------------
      # 版本一致性：M2 仍为非阻塞报告（feature HEAD 本就与 develop 不同）。
      # continue-on-error 保证该报告永不阻断 CI；即便脚本自身异常也不误报失败。
      # ------------------------------------------------------------------
      - name: Version consistency report (non-blocking)
        continue-on-error: true
        run: bash scripts/check-version-consistency.sh

  # ------------------------------------------------------------------------
  # M2 真实服务 E2E：起 PG16 service 容器 → migrate deploy → seed 管理员 →
  # 后台启动 NestJS(3001) 与 Vite(5173) → Playwright 打真实 /api 与真实页面。
  #
  # 触发范围说明（三路并行 PR 阶段的设计）：
  # 三份 package.json 已齐全，但 M2 后端业务实现 / 前端实接分别由另外两个并行 PR
  # 交付。任何单个 feature PR 都缺另外两路代码，此时跑真实服务 E2E 必然失败，
  # 且失败原因与本次改动无关。故本 job 只在 develop / main 的 push（即三路合并态）
  # 或项目组长手动 workflow_dispatch 时运行；合并态 CI 是否全绿由组长合并后实跑
  # 验证。quality-gate 仍对每个 PR 全量运行，不会被跳过。
  #
  # 所有口令都是**CI 专用的公开字面占位值或本次运行随机生成**，仅存在于该次
  # runner 的内存/容器里，绝不写进仓库、绝不打印、不是任何人的真实凭据。
  # ------------------------------------------------------------------------
  e2e-real:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusgo
          # CI 专用公开占位值，非真实口令；与下方 DATABASE_URL 保持完全一致。
          POSTGRES_PASSWORD: campusgo-ci-only-2026
          POSTGRES_DB: campusgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusgo -d campusgo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campusgo:campusgo-ci-only-2026@localhost:5432/campusgo?schema=public
      SERVER_PORT: 3001
      WEB_PORT: 5173
      VITE_API_BASE_URL: http://localhost:3001/api
      VITE_USE_MOCK: 'false'
      # JWT 密钥同为 CI 专用公开占位值（非真实密钥）。
      JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-key-2026
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-key-2026
      CORS_ORIGINS: http://localhost:5173
      E2E_MODE: real
      E2E_API_BASE: http://localhost:3001/api
      E2E_ENTRY_URL: http://localhost:5173
      ADMIN_SEED_EMAIL: admin@campusgo.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 与 quality-gate 完全相同的前置顺序，缺一不可。
      - name: Build shared package
        run: pnpm --filter @campus-go/shared run build
      - name: Generate Prisma Client
        run: pnpm --filter @campus-go/server exec prisma generate

      # 种子管理员口令：每次运行用 openssl 生成随机值，只经 GITHUB_ENV 注入本次
      # runner；seed 脚本与 E2E 用例读同一个 ADMIN_SEED_PASSWORD，绝不落进仓库。
      - name: Prepare random test admin credentials
        run: |
          echo "ADMIN_SEED_PASSWORD=E2e$(openssl rand -hex 12)Aa1" >> "$GITHUB_ENV"

      - name: Apply migrations (prisma migrate deploy)
        run: pnpm --filter @campus-go/server exec prisma migrate deploy

      - name: Seed initial ADMIN
        run: pnpm --filter @campus-go/server run seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # server / web 在后台启动；等待端口与 /api 可达后再跑用例。
      - name: Start NestJS server and Vite dev server
        run: |
          nohup pnpm --filter @campus-go/server run start > /tmp/campusgo-server.log 2>&1 &
          echo $! > /tmp/campusgo-server.pid
          nohup pnpm --filter @campus-go/web run dev -- --host 127.0.0.1 > /tmp/campusgo-web.log 2>&1 &
          echo $! > /tmp/campusgo-web.pid
          npx --yes wait-on --timeout 180000 http-get://127.0.0.1:3001/api/activities
          npx --yes wait-on --timeout 180000 http-get://127.0.0.1:5173/

      - name: E2E against REAL services (PG16 + NestJS + Vite)
        run: pnpm run test:e2e:real

      - name: Service logs on failure
        if: failure()
        run: |
          echo "===== server ====="; tail -80 /tmp/campusgo-server.log || true
          echo "===== web ====="; tail -80 /tmp/campusgo-web.log || true

      - name: Stop background services
        if: always()
        run: |
          kill "$(cat /tmp/campusgo-server.pid)" 2>/dev/null || true
          kill "$(cat /tmp/campusgo-web.pid)" 2>/dev/null || true
